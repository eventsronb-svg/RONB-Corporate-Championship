<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Cricksal Live Match · RONB Events</title>
    <link rel="stylesheet" href="/assets/futsal.css?v=20261009-1" />
    <script type="module" src="/assets/cricket-match.js?v=20261008-4"></script>
    <!-- Cricket's sizing overrides live in futsal.css: the response ships
         style-src 'self', so an inline <style> block here would be dropped by
         the CSP and never apply. -->
  </head>
  <body class="futsal-live cricket-live">
    <main class="live-page">
      <div class="frame-marks">
        <img src="/assets/images/XTREME.png" alt="Xtreme" />
        <img src="/assets/images/logo.png" alt="RONB Events" />
      </div>
      <p class="eyebrow"><span id="state">Loading</span></p>
      <div id="match" aria-live="polite"><p class="loading">Loading match…</p></div>
    </main>
  </body>
</html>
